<input
  id="darkMode"
  type="checkbox"
  [checked]="darkMode$"
  (change)="onToggle()"
  class="toggle"
/>
<label  class="toggle-label  handPointer" for="darkMode">
  <img
    src="../../../../assets/images/img/moon1.svg"
    class="moon"
  />
  <img
    src="../../../../assets/images/img/sun1.svg"
    class="sun"
  />
</label>
