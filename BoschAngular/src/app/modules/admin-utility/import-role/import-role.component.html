<!-- <p>import-role works!</p> -->
<div class="container-fluid px-2">
    <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
</div>

<div class="container-fluid card px-2 pt-0">
    <div class="col-sm-12 px-2 py-2 my-2 label" style="font-size: 20px;">
        Import Role
    </div>
</div>

<div class="container-fluid px-2">
    <div class="card px-2 pt-2 rounded" style="border-radius: 5px !important;">
        <div class="card OpFormCard mb-3 px-2" style="display: block;">
            <form #import="ngForm" class="col-sm-12 row p-3" (ngSubmit)="onRoleImportSubmit(import)">
                <div class="col-sm-6 px-3 row d-flex justify-content-center align-items-center">
                    <span class="dialogLabel">Download the standard template for roles: </span>
                    <a href="assets/Role.csv" download="Roles.csv" class="d-flex align-items-center">
                        <i class="fa-solid fa-file-excel"
                            style="font-size: 16px; margin-right: 8px; color: green;"></i>
                        <span style="font-size: 13px;">Roles.csv</span>
                    </a>
                </div>

                <div class="col-sm-6 px-3 d-flex justify-content-center align-items-center">
                    <label for="csvUpload" class="m-2 d-flex align-items-center">
                        <i class="fa fa-upload" style="font-size: 16px; margin-right: 8px; color: #1968B3;"></i>
                        <span class="dialogLabel">Upload File</span>
                    </label>
                    <div class="col-sm-12">
                        <input type="file" id="csvUpload" name="csvUpload" accept=".csv"
                            class="col-sm-8 dialogLabel" style="border: solid 1px gray;"
                            (change)="onFileChange($event)" />
                    </div>
                </div>

                <div class="col-sm-12 row">
                    <div class="col-sm-4 p-2 d-flex justify-content-center align-items-center">
                        <button type="button" class="col-sm-2 btn button" (click)="clearFile()">Clear</button>
                    </div>

                    <div class="col-sm-4 p-2 d-flex justify-content-center align-items-center">
                        <button class="col-sm-2 btn button" type="reset" (click)="this.redirectback()">Back</button>
                    </div>

                    <div class="col-sm-4 p-2 d-flex justify-content-center align-items-center">
                        <button class="col-sm-2 btn button" type="submit" [disabled]="!isFileValid">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
